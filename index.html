<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>가계부</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="nav" id="prev" aria-label="이전 달">‹</button>
  <h1 id="title">가계부</h1>
  <button class="nav" id="next" aria-label="다음 달">›</button>
</header>

<main id="app">
 <div class="colL">
  <section class="summary" id="summary"></section>

  <div class="seg" role="tablist" id="sideTabs">
    <button role="tab" data-side="all" class="on">전체</button>
    <button role="tab" data-side="me">내 돈</button>
    <button role="tab" data-side="mom">엄마카드</button>
  </div>

  <section class="card" id="catCard">
    <h2>분류별</h2>
    <div id="cats"></div>
  </section>

  <section class="card" id="pendingCard" hidden>
    <h2>금액 확인 필요</h2>
    <ul class="list" id="pending"></ul>
  </section>
 </div>
 <div class="colR">
  <div class="search"><input id="q" type="search" placeholder="이 달 내역 검색" autocomplete="off"></div>
  <section id="days"></section>
 </div>
</main>

<footer class="foot" id="foot"></footer>
<script src="app.js"></script>
</body>
</html>
